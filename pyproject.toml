[project]
name = "catapa-mcp"
version = "0.1.0"
description = "MCP server exposing CATAPA's public and private API SDKs as tools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "catapa>=0.3.6,<0.4.0",
    "catapa-private>=0.1.3,<0.2.0",
]

[project.scripts]
catapa-mcp = "catapa_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catapa_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "B9", "C", "E", "F", "I", "W"]
ignore = ["C901"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
